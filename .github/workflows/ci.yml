name: EVERA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Simulation typecheck
        run: npm run typecheck:simulation
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Native tooling sanity check
        run: npx cap --version
